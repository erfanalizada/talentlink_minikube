apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: talentlink-local
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: user-service
          image: ghcr.io/erfanalizada/talentlink_minikube-user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: ENVIRONMENT
              value: local
            - name: DATABASE_URL
              value: "postgresql://userservice:userservice123@userdb-postgres:5432/userdb"
            - name: UPLOAD_DIR
              value: "/app/uploads"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/users/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/users/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: uploads
          emptyDir: {}
