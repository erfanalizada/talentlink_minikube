apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: talentlink-local
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      orgId: 1
      url: http://prometheus:9090
      basicAuth: false
      isDefault: true
      editable: true
    - name: Jaeger
      type: jaeger
      access: proxy
      orgId: 1
      url: http://jaeger:16686
      basicAuth: false
      isDefault: false
      editable: true
