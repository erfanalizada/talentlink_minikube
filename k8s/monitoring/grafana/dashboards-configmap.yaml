apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: talentlink-local
data:
  talentlink-services.json: |
    {
      "dashboard": {
        "title": "TalentLink Services Overview",
        "tags": ["talentlink", "services"],
        "timezone": "browser",
        "panels": [
          {
            "title": "HTTP Request Rate",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum by (service) (rate(flask_http_request_total[5m]))",
                "legendFormat": "{{service}}",
                "refId": "A"
              }
            ],
            "yaxes": [
              {"format": "reqps", "label": "Requests/sec"},
              {"format": "short"}
            ]
          },
          {
            "title": "HTTP Response Codes",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "sum by (status) (rate(flask_http_request_total[5m]))",
                "legendFormat": "{{status}}",
                "refId": "A"
              }
            ]
          },
          {
            "title": "Request Duration (95th percentile)",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum by (le, service) (rate(flask_http_request_duration_seconds_bucket[5m])))",
                "legendFormat": "{{service}}",
                "refId": "A"
              }
            ],
            "yaxes": [
              {"format": "s", "label": "Duration"},
              {"format": "short"}
            ]
          },
          {
            "title": "Service Uptime",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "up{job=~\".*-service\"}",
                "legendFormat": "{{job}}",
                "refId": "A"
              }
            ]
          }
        ],
        "refresh": "10s",
        "time": {"from": "now-1h", "to": "now"},
        "timepicker": {}
      }
    }
