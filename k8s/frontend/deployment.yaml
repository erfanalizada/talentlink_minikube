apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: talentlink-local
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/erfanalizada/talentlink_minikube-frontend:latest  # 👈 GHCR image
          imagePullPolicy: Always                                  # 👈 Always pull latest
          ports:
            - containerPort: 80
          env:
            - name: ENVIRONMENT
              value: local
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5

          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx

      volumes:
        - name: nginx-logs
          emptyDir: {}
